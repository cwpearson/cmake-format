name: Build and release cmake-format

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_FORMAT_VERSION: "0.6.13"
  PYINSTALLER_VERSION: "6.21.0"
  MANYLINUX_PYTHON: "/opt/python/cp312-cp312/bin/python"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            asset: cmake-format-0.6.13-linux-amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset: cmake-format-0.6.13-linux-arm64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - name: macos-arm64
            # macos-14 is GitHub's Apple Silicon runner label.
            os: macos-14
            asset: cmake-format-0.6.13-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - name: Build Linux binary in manylinux2014 container
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            -e HOME=/tmp \
            -e CMAKE_FORMAT_VERSION \
            -e PYINSTALLER_VERSION \
            -e MANYLINUX_PYTHON \
            ${{ matrix.manylinux_image }} \
            bash -euxo pipefail -c '
              "${MANYLINUX_PYTHON}" -m venv /tmp/cmake-format-venv
              /tmp/cmake-format-venv/bin/python -m pip install --upgrade pip
              /tmp/cmake-format-venv/bin/python -m pip install "cmakelang==${CMAKE_FORMAT_VERSION}" "PyInstaller==${PYINSTALLER_VERSION}"
              /tmp/cmake-format-venv/bin/python scripts/build.py --name "${{ matrix.asset }}"
              ./dist/${{ matrix.asset }} --version
            '
      - uses: actions/setup-python@v6
        if: startsWith(matrix.name, 'macos-')
        with:
          python-version: "3.12"
      - name: Install macOS build dependencies
        if: startsWith(matrix.name, 'macos-')
        run: python -m pip install "cmakelang==${CMAKE_FORMAT_VERSION}" "PyInstaller==${PYINSTALLER_VERSION}"
      - name: Build macOS binary
        if: startsWith(matrix.name, 'macos-')
        run: python scripts/build.py --name ${{ matrix.asset }}
      - name: Smoke test macOS binary
        if: startsWith(matrix.name, 'macos-')
        run: ./dist/${{ matrix.asset }} --version
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - id: tag
        name: Compute release tag
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          echo "tag=${branch}-${short_sha}" >> "$GITHUB_OUTPUT"
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: cmake-format ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          make_latest: true
