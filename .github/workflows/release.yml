name: Build and release cmake-format

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_FORMAT_VERSION: "0.6.13"
  PYINSTALLER_VERSION: "6.21.0"
  CPYTHON_VERSION: "3.12.12"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            asset: cmake-format-0.6.13-linux-amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset: cmake-format-0.6.13-linux-arm64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - name: macos-arm64
            # macos-14 is GitHub's Apple Silicon runner label.
            os: macos-14
            asset: cmake-format-0.6.13-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - name: Build Linux binary in manylinux2014 container
        if: startsWith(matrix.name, 'linux-')
        shell: bash
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            -e HOME=/tmp \
            -e CMAKE_FORMAT_VERSION \
            -e PYINSTALLER_VERSION \
            -e CPYTHON_VERSION \
            ${{ matrix.manylinux_image }} \
            bash -euxo pipefail -c '
              curl -fsSL -o "/tmp/Python-${CPYTHON_VERSION}.tgz" "https://www.python.org/ftp/python/${CPYTHON_VERSION}/Python-${CPYTHON_VERSION}.tgz"
              tar -xzf "/tmp/Python-${CPYTHON_VERSION}.tgz" -C /tmp
              OPENSSL_PREFIX="$(find /opt/_internal -mindepth 1 -maxdepth 1 -type d -name "openssl-*" | sort -V | tail -n1)"
              test -n "${OPENSSL_PREFIX}"
              "${OPENSSL_PREFIX}/bin/openssl" version
              cd "/tmp/Python-${CPYTHON_VERSION}"
              ./configure --prefix=/tmp/cpython --enable-shared --with-ensurepip=install --with-openssl="${OPENSSL_PREFIX}" --with-openssl-rpath=auto
              make -j"$(nproc)"
              make install
              export LD_LIBRARY_PATH=/tmp/cpython/lib
              /tmp/cpython/bin/python3 -c "import ssl; print(ssl.OPENSSL_VERSION)"
              /tmp/cpython/bin/python3 -m pip install --upgrade pip
              /tmp/cpython/bin/python3 -m pip install "cmakelang==${CMAKE_FORMAT_VERSION}" "PyInstaller==${PYINSTALLER_VERSION}"
              cd /work
              /tmp/cpython/bin/python3 scripts/build.py --name "${{ matrix.asset }}"
              ! readelf --version-info /tmp/cpython/lib/libpython3.12.so.1.0 | grep -Eq "GLIBC_2\\.(1[89]|[2-9][0-9])"
            '
      - uses: actions/setup-python@v6
        if: startsWith(matrix.name, 'macos-')
        with:
          python-version: "3.12"
      - name: Install macOS build dependencies
        if: startsWith(matrix.name, 'macos-')
        run: python -m pip install "cmakelang==${CMAKE_FORMAT_VERSION}" "PyInstaller==${PYINSTALLER_VERSION}"
      - name: Build macOS binary
        if: startsWith(matrix.name, 'macos-')
        run: python scripts/build.py --name ${{ matrix.asset }}
      - name: Smoke test binary
        run: ./dist/${{ matrix.asset }} --version
      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: cmake-format ${{ github.ref_name }}
          files: artifacts/*
          make_latest: true
